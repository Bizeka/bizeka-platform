name: Bug report
description: Something in a Platform module does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; follow SECURITY.md instead.
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [Extensions, DynamicForms, Todo, OnlineChat, Theme, Demo, Tooling or docs]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Platform package version, Serenity version, .NET SDK, database provider and browser.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal reproduction with synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
