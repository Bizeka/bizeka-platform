version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Serenity, Sergen and the migration stack move only in the coordinated upgrade (docs/adr/0003-coordinated-serenity-upgrade.md).
    ignore:
      - dependency-name: "Serenity.*"
      - dependency-name: "sergen"
      - dependency-name: "FluentMigrator*"
      # .NET runtime libraries and SQL providers stay on the .NET 10 / Serenity line; majors move with the platform upgrade.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "MySqlConnector"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directories:
      - /src/bizeka.extensions
      - /src/bizeka.dynamicforms
      - /src/bizeka.todo
      - /src/bizeka.onlinechat
      - /src/bizeka.theme
      - /src/bizeka.demo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@serenity-is/*"
      # TypeScript majors move with the Serenity upgrade.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The SignalR client follows the .NET server major.
      - dependency-name: "@microsoft/signalr"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
